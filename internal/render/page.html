<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>podpeers capture</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4;
  --pod: #2f6fdf; --svc: #11845b; --node: #8a5a00; --ext: #b3261e; --closed: #9a9a94;
  --accent: #2f6fdf; --ns: rgba(47,111,223,0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151614; --panel: #1e1f1c; --ink: #ecece8; --muted: #9c9c96; --line: #34352f;
    --pod: #7aa7ff; --svc: #4cc994; --node: #e0a84a; --ext: #ff8a80; --closed: #6c6c66;
    --accent: #7aa7ff; --ns: rgba(122,167,255,0.07);
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
header h1 { font-size: 16px; margin: 0; }
header .meta { color: var(--muted); font-size: 13px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: calc(100vh - 50px); }
@media (max-width: 820px) { main { grid-template-columns: 1fr; height: auto; } #graph { height: 60vh; } }
#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 16px; }
aside h2 { font-size: 15px; margin: 0 0 4px; word-break: break-all; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
td, th { text-align: left; padding: 3px 6px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.pill { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 12px; border: 1px solid var(--line); }
.bad { color: var(--ext); }
.muted { color: var(--muted); }
input[type=search] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
textarea { width: 100%; min-height: 110px; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
pre { font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; background: var(--bg); padding: 8px; border-radius: 6px; max-height: 320px; overflow: auto; }
button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
svg text { fill: var(--ink); font-size: 11px; pointer-events: none; }
svg .nslabel { fill: var(--muted); font-size: 12px; font-weight: 600; }
svg .flow { stroke: var(--muted); stroke-width: 1.3; fill: none; }
svg .flow.closed { stroke: var(--closed); stroke-dasharray: 5 4; }
svg .flow.hl { stroke: var(--accent); stroke-width: 2.4; }
svg .flow.dim, svg .n.dim { opacity: .18; }
svg .n circle, svg .n rect, svg .n polygon { stroke-width: 2; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>podpeers</h1>
  <span class="meta" id="summary"></span>
  <span class="legend">
    <span><i style="background:var(--pod)"></i>pod</span>
    <span><i style="background:var(--svc)"></i>service</span>
    <span><i style="background:var(--node)"></i>node</span>
    <span><i style="background:var(--ext)"></i>external</span>
    <span>hollow = not probed · dashed line = closed during window</span>
  </span>
</header>
<main>
  <svg id="graph" aria-label="peer graph"></svg>
  <aside>
    <input type="search" id="find" placeholder="find pod, service or IP">
    <div id="detail"><p class="muted">Select a node to see its peers. Drag to pan, scroll to zoom.</p></div>
    <div id="console" hidden>
      <h3>GraphQL</h3>
      <textarea id="q">{
  pods(status: "observed") {
    id
    peers(direction: "outbound") { id kind }
  }
}</textarea>
      <button id="run">Run query</button>
      <pre id="out"></pre>
    </div>
  </aside>
</main>
<script>
const DATA = /*__DATA__*/null;
const GRAPHQL = /*__GRAPHQL__*/"";
const NS = "http://www.w3.org/2000/svg";
const el = (n, a = {}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

const nodes = new Map();
const podById = new Map(DATA.pods.map(p => [p.namespace + "/" + p.name, p]));
function peerId(p) { return p.kind === "pod" ? p.namespace + "/" + p.name : p.kind === "service" ? "svc/" + p.namespace + "/" + p.name : p.kind === "node" ? "node/" + p.name : p.ip; }
for (const p of DATA.pods) nodes.set(p.namespace + "/" + p.name, { id: p.namespace + "/" + p.name, kind: "pod", label: p.name, ns: p.namespace, pod: p });
for (const e of DATA.edges) {
  const id = peerId(e.peer);
  if (!nodes.has(id)) nodes.set(id, { id, kind: e.peer.kind, label: e.peer.name || e.peer.ip, ns: e.peer.namespace || "(outside)", peer: e.peer });
}
const flows = new Map();
for (const e of DATA.edges) {
  const [from, to] = e.direction === "outbound" ? [e.pod, peerId(e.peer)] : [peerId(e.peer), e.pod];
  const k = from + "|" + to + "|" + e.protocol + "|" + e.port;
  const f = flows.get(k) || { from, to, port: e.port, protocol: e.protocol, open: false, seenOn: [] };
  f.open = f.open || e.open; f.seenOn.push(e.pod); flows.set(k, f);
}
const N = [...nodes.values()], F = [...flows.values()];
const counts = DATA.pods.reduce((m, p) => (m[p.probe.status] = (m[p.probe.status] || 0) + 1, m), {});
document.getElementById("summary").textContent =
  `selector "${DATA.selector.labelSelector}" in ${DATA.selector.namespace || "all namespaces"} · ` +
  `${counts.observed || 0} observed, ${counts.failed || 0} failed, ${counts.skipped || 0} skipped · ${F.length} flows · ` +
  `${DATA.window.start} → ${DATA.window.end}`;

// Layout: namespaces get anchors on a circle; nodes are pulled to their anchor,
// pushed apart from each other, and pulled together along flows.
const nss = [...new Set(N.map(n => n.ns))].sort();
const R = 160 + 60 * nss.length;
const anchor = {};
nss.forEach((ns, i) => { const a = 2 * Math.PI * i / nss.length; anchor[ns] = { x: nss.length > 1 ? R * Math.cos(a) : 0, y: nss.length > 1 ? R * Math.sin(a) : 0 }; });
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (const n of N) { n.x = anchor[n.ns].x + (rnd() - .5) * 120; n.y = anchor[n.ns].y + (rnd() - .5) * 120; }
for (let it = 0; it < 400; it++) {
  const cool = 1 - it / 400;
  for (const a of N) { a.vx = (anchor[a.ns].x - a.x) * 0.02; a.vy = (anchor[a.ns].y - a.y) * 0.02; }
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
    const a = N[i], b = N[j]; let dx = a.x - b.x, dy = a.y - b.y; let d2 = dx * dx + dy * dy || 0.01;
    const f = 2200 / d2; const d = Math.sqrt(d2); dx /= d; dy /= d;
    a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
  }
  for (const f of F) {
    const a = nodes.get(f.from), b = nodes.get(f.to); const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1, k = (d - 110) * 0.01;
    a.vx += dx / d * k * d * .05; a.vy += dy / d * k * d * .05; b.vx -= dx / d * k * d * .05; b.vy -= dy / d * k * d * .05;
  }
  for (const n of N) { n.x += Math.max(-30, Math.min(30, n.vx)) * cool; n.y += Math.max(-30, Math.min(30, n.vy)) * cool; }
}

const svg = document.getElementById("graph");
const defs = el("defs", {}, svg);
const mk = el("marker", { id: "arrow", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
el("path", { d: "M0,0 L10,5 L0,10 z", fill: "currentColor" }, mk).style.color = "var(--muted)";
const root = el("g", {}, svg);
const gNS = el("g", {}, root), gF = el("g", {}, root), gN = el("g", {}, root);
const color = { pod: "var(--pod)", service: "var(--svc)", node: "var(--node)", external: "var(--ext)" };

function drawNamespaces() {
  gNS.replaceChildren();
  for (const ns of nss) {
    const ms = N.filter(n => n.ns === ns); if (!ms.length) continue;
    const xs = ms.map(n => n.x), ys = ms.map(n => n.y);
    const x0 = Math.min(...xs) - 50, y0 = Math.min(...ys) - 42, x1 = Math.max(...xs) + 50, y1 = Math.max(...ys) + 34;
    el("rect", { x: x0, y: y0, width: x1 - x0, height: y1 - y0, rx: 14, fill: "var(--ns)", stroke: "var(--line)" }, gNS);
    el("text", { x: x0 + 10, y: y0 + 16, class: "nslabel" }, gNS).textContent = ns;
  }
}
function trim(a, b, r) { const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1; return { x: b.x - dx / d * r, y: b.y - dy / d * r }; }
for (const f of F) {
  f.g = el("g", {}, gF);
  f.line = el("path", { class: "flow" + (f.open ? "" : " closed"), "marker-end": "url(#arrow)" }, f.g);
  f.text = el("text", { "text-anchor": "middle" }, f.g); f.text.textContent = f.protocol + "/" + f.port;
  const t = el("title", {}, f.line); t.textContent = `${f.from} → ${f.to} ${f.protocol}/${f.port}${f.open ? "" : " (closed during window)"}`;
}
for (const n of N) {
  n.g = el("g", { class: "n" }, gN);
  const c = color[n.kind] || "var(--ext)";
  const hollow = n.pod && n.pod.probe.status !== "observed";
  const fill = hollow ? "var(--panel)" : c;
  if (n.kind === "service") n.shape = el("rect", { x: -11, y: -11, width: 22, height: 22, rx: 6, fill, stroke: c }, n.g);
  else if (n.kind === "external" || n.kind === "node") n.shape = el("polygon", { points: "0,-13 13,0 0,13 -13,0", fill, stroke: c }, n.g);
  else n.shape = el("circle", { r: 11, fill, stroke: c, "stroke-dasharray": n.pod && n.pod.probe.status !== "observed" && n.pod.probe.status !== "not-targeted" ? "3 3" : "" }, n.g);
  const t = el("text", { y: 26, "text-anchor": "middle" }, n.g); t.textContent = n.label;
  n.g.addEventListener("click", ev => { ev.stopPropagation(); select(n.id); });
  n.g.addEventListener("pointerdown", ev => { ev.stopPropagation(); dragNode = n; svg.setPointerCapture(ev.pointerId); });
}
function draw() {
  for (const n of N) n.g.setAttribute("transform", `translate(${n.x},${n.y})`);
  for (const f of F) {
    const a = nodes.get(f.from), b = nodes.get(f.to), e = trim(a, b, 15);
    if (a === b) { f.line.setAttribute("d", `M${a.x},${a.y - 12} c30,-40 50,0 14,10`); continue; }
    f.line.setAttribute("d", `M${a.x},${a.y} L${e.x},${e.y}`);
    f.text.setAttribute("x", (a.x + b.x) / 2); f.text.setAttribute("y", (a.y + b.y) / 2 - 4);
  }
  drawNamespaces();
}
draw();

// Pan / zoom / drag.
let view = { x: 0, y: 0, k: 1 }, dragNode = null, panning = null;
function fit() {
  const xs = N.map(n => n.x), ys = N.map(n => n.y), r = svg.getBoundingClientRect();
  if (!N.length) return;
  const w = Math.max(...xs) - Math.min(...xs) + 160, h = Math.max(...ys) - Math.min(...ys) + 160;
  view.k = Math.min(r.width / w, r.height / h, 1.6);
  view.x = r.width / 2 - view.k * (Math.min(...xs) + Math.max(...xs)) / 2;
  view.y = r.height / 2 - view.k * (Math.min(...ys) + Math.max(...ys)) / 2; apply();
}
function apply() { root.setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`); }
function toLocal(ev) { const r = svg.getBoundingClientRect(); return { x: (ev.clientX - r.left - view.x) / view.k, y: (ev.clientY - r.top - view.y) / view.k }; }
svg.addEventListener("pointerdown", ev => { panning = { x: ev.clientX - view.x, y: ev.clientY - view.y }; svg.setPointerCapture(ev.pointerId); });
svg.addEventListener("pointermove", ev => {
  if (dragNode) { const p = toLocal(ev); dragNode.x = p.x; dragNode.y = p.y; draw(); }
  else if (panning) { view.x = ev.clientX - panning.x; view.y = ev.clientY - panning.y; apply(); }
});
svg.addEventListener("pointerup", () => { dragNode = null; panning = null; });
svg.addEventListener("wheel", ev => {
  ev.preventDefault(); const r = svg.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.max(0.2, Math.min(4, view.k * (ev.deltaY < 0 ? 1.1 : 0.9)));
  view.x = mx - (mx - view.x) * k / view.k; view.y = my - (my - view.y) * k / view.k; view.k = k; apply();
}, { passive: false });
svg.addEventListener("click", () => select(null));
window.addEventListener("resize", fit); fit();

function rows(list) {
  if (!list.length) return '<p class="muted">none observed</p>';
  return "<table><tr><th>peer</th><th>port</th><th>state</th></tr>" + list.map(f =>
    `<tr><td><a href="#" data-id="${esc(f.peer)}">${esc(f.peer)}</a></td><td>${esc(f.protocol)}/${f.port}</td><td>${f.open ? "open" : '<span class="muted">closed</span>'}</td></tr>`).join("") + "</table>";
}
function select(id) {
  const d = document.getElementById("detail");
  for (const n of N) n.g.classList.toggle("dim", !!id && n.id !== id && !F.some(f => (f.from === id && f.to === n.id) || (f.to === id && f.from === n.id)));
  for (const f of F) { const on = id && (f.from === id || f.to === id); f.line.classList.toggle("hl", !!on); f.g.classList.toggle("dim", !!id && !on); }
  if (!id) { d.innerHTML = '<p class="muted">Select a node to see its peers. Drag to pan, scroll to zoom.</p>'; return; }
  const n = nodes.get(id); let h = `<h2>${esc(id)}</h2><span class="pill">${esc(n.kind)}</span> `;
  if (n.pod) {
    const p = n.pod.probe;
    h += `<span class="pill ${p.status === "failed" ? "bad" : ""}">${esc(p.status)}</span>`;
    if (p.reason) h += `<p class="${p.status === "failed" ? "bad" : "muted"}">${esc(p.reason)}</p>`;
    if (n.pod.ip) h += `<p class="muted">IP ${esc(n.pod.ip)}${n.pod.node ? " · node " + esc(n.pod.node) : ""}${p.samples ? " · " + p.samples + " samples" : ""}</p>`;
    if (n.pod.labels) h += "<h3>labels</h3>" + Object.entries(n.pod.labels).map(([k, v]) => `<span class="pill">${esc(k)}=${esc(v)}</span>`).join(" ");
    if (n.pod.listening) h += "<h3>listening</h3>" + n.pod.listening.map(l => `<span class="pill">${esc(l.protocol)}/${l.port}</span>`).join(" ");
  } else if (n.peer) h += `<p class="muted">${esc(n.peer.ip)}</p>`;
  const inb = F.filter(f => f.to === id).map(f => ({ ...f, peer: f.from }));
  const out = F.filter(f => f.from === id).map(f => ({ ...f, peer: f.to }));
  h += "<h3>inbound (who connects here)</h3>" + rows(inb) + "<h3>outbound (where it connects)</h3>" + rows(out);
  d.innerHTML = h;
  d.querySelectorAll("a[data-id]").forEach(a => a.addEventListener("click", ev => { ev.preventDefault(); select(a.dataset.id); }));
}
document.getElementById("find").addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase(); if (!q) return select(null);
  const n = N.find(n => n.id.toLowerCase().includes(q) || (n.pod && (n.pod.ip || "").startsWith(q)) || (n.peer && n.peer.ip.startsWith(q)));
  if (n) select(n.id);
});
if (GRAPHQL) {
  document.getElementById("console").hidden = false;
  document.getElementById("run").addEventListener("click", async () => {
    const out = document.getElementById("out"); out.textContent = "…";
    try {
      const r = await fetch(GRAPHQL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ query: document.getElementById("q").value }) });
      out.textContent = JSON.stringify(await r.json(), null, 2);
    } catch (e) { out.textContent = String(e); }
  });
}
</script>
</body>
</html>
