<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>podpeers capture</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6;
  --pod: #2f6fdf; --svc: #11845b; --node: #8a5a00; --ext: #b3261e; --closed: #a4a49e;
  --accent: #d9480f; --ns: rgba(47,111,223,0.05); --edge: #8d8d86;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151614; --panel: #1e1f1c; --ink: #ecece8; --muted: #9c9c96; --line: #34352f;
    --pod: #7aa7ff; --svc: #4cc994; --node: #e0a84a; --ext: #ff8a80; --closed: #6c6c66;
    --accent: #ff9b5e; --ns: rgba(122,167,255,0.06); --edge: #8a8a84;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
header h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
header .meta { color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 3px 12px; background: var(--panel); color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--bg); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: calc(100vh - 52px); }
@media (max-width: 820px) { main { grid-template-columns: 1fr; height: auto; } #graph { height: 60vh; } }
#graph { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 16px; }
aside h2 { font-size: 16px; margin: 0 0 4px; word-break: break-all; }
aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 16px 0 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
td, th { text-align: left; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
td a { color: var(--ink); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-left: auto; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
.pill { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 12px; border: 1px solid var(--line); margin: 0 4px 4px 0; }
.bad { color: var(--ext); }
.muted { color: var(--muted); }
input[type=search] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
textarea { width: 100%; min-height: 110px; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
pre { font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; background: var(--bg); padding: 8px; border-radius: 6px; max-height: 320px; overflow: auto; }
pre:empty { display: none; }
details.limits { margin-top: 12px; font-size: 13px; }
details.limits summary { cursor: pointer; font-weight: 600; }
details.limits li { margin: 6px 0; color: var(--muted); }
button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
svg text { fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
svg .nlabel { font-size: 13px; font-weight: 600; }
svg .nsub { font-size: 11px; fill: var(--muted); }
svg .elabel { font-size: 11px; fill: var(--muted); }
svg .nslabel { fill: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .03em; }
svg .flow { stroke: var(--edge); stroke-width: 1.6; fill: none; }
svg .flow.closed { stroke: var(--closed); stroke-dasharray: 5 4; }
svg .flow.attempted { stroke: var(--ext); stroke-dasharray: 2 4; }
svg .flow.hl { stroke: var(--accent); stroke-width: 2.6; }
svg g.dim { opacity: .15; }
svg .n .shape { stroke-width: 2.5; cursor: pointer; }
svg .n.sel .shape { stroke: var(--accent); stroke-width: 4; }
</style>
</head>
<body>
<header>
  <h1>podpeers</h1>
  <span class="seg" role="group" aria-label="view"><button id="v-wl" class="on">Workloads</button><button id="v-pod">Pods</button></span>
  <span class="meta" id="summary"></span>
  <span class="legend">
    <span><i style="background:var(--pod)"></i>workload / pod</span>
    <span><i style="background:var(--svc)"></i>service</span>
    <span><i style="background:var(--node)"></i>node</span>
    <span><i style="background:var(--ext)"></i>external</span>
    <span>hollow = not probed · dashed = closed in window · red dots = never connected</span>
  </span>
</header>
<main>
  <svg id="graph" aria-label="peer graph"></svg>
  <aside>
    <input type="search" id="find" placeholder="find a workload, pod, service or IP">
    <div id="detail"></div>
    <div id="console" hidden>
      <h3>GraphQL</h3>
      <textarea id="q">{
  pods(status: "observed") {
    id
    peers(direction: "outbound") { id kind }
  }
}</textarea>
      <button id="run">Run query</button>
      <pre id="out"></pre>
    </div>
  </aside>
</main>
<script>
const DATA = /*__DATA__*/null;
const GRAPHQL = /*__GRAPHQL__*/"";
const NS = "http://www.w3.org/2000/svg";
const el = (n, a = {}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

const pods = DATA.pods || [], edges = DATA.edges || [], services = DATA.services || [];
const podById = new Map(pods.map(p => [p.namespace + "/" + p.name, p]));
const svcById = new Map(services.map(s => [s.namespace + "/" + s.name, s]));
const wlOf = p => p.workload || ("Pod/" + p.name);
const wlKey = p => p.namespace + "/" + wlOf(p);
const wlName = p => wlOf(p).slice(wlOf(p).indexOf("/") + 1);
const matches = (labels, sel) => Object.keys(sel || {}).length > 0 && Object.entries(sel).every(([k, v]) => (labels || {})[k] === v);
const svcPods = s => pods.filter(p => p.namespace === s.namespace && matches(p.labels, s.selector));
function targetPort(s, port, proto) {
  const sp = (s.ports || []).find(x => x.port === port && x.protocol === proto);
  return sp && /^\d+$/.test(sp.targetPort) ? Number(sp.targetPort) : port;
}
const fmtTime = t => (t || "").replace("T", " ").replace(/\.\d+Z$/, "Z").slice(0, 20);
const counts = pods.reduce((m, p) => (m[p.probe.status] = (m[p.probe.status] || 0) + 1, m), {});
document.getElementById("summary").textContent =
  `"${DATA.selector.labelSelector}" in ${DATA.selector.namespace || "all namespaces"} · ` +
  `${counts.observed || 0} pods observed${counts.failed ? ", " + counts.failed + " failed" : ""}${counts.skipped ? ", " + counts.skipped + " skipped" : ""} · ` +
  `${fmtTime(DATA.window.start)} → ${fmtTime(DATA.window.end).slice(11)} every ${DATA.window.interval}`;

// build returns {nodes: Map, flows: []} for a view: "wl" folds replicas into
// their workload and services into the workloads behind them; "pod" keeps both.
function build(view) {
  const nodes = new Map(), flows = new Map();
  const podNode = p => {
    const id = view === "wl" ? "wl:" + wlKey(p) : p.namespace + "/" + p.name;
    let n = nodes.get(id);
    if (!n) { n = { id, kind: "pod", ns: p.namespace, label: view === "wl" ? wlName(p) : p.name, members: [] }; nodes.set(id, n); }
    if (!n.members.includes(p)) n.members.push(p);
    return n;
  };
  for (const p of pods) podNode(p);
  // endpoints of one side of an edge, as [nodeId, port] pairs
  const ends = (peer, port, proto) => {
    if (peer.kind === "pod") {
      const p = podById.get(peer.namespace + "/" + peer.name);
      if (p) return [[podNode(p).id, port]];
    }
    if (peer.kind === "service") {
      const s = svcById.get(peer.namespace + "/" + peer.name);
      if (view === "wl" && s) {
        const ps = svcPods(s);
        if (ps.length) return [...new Set(ps.map(p => podNode(p).id))].map(id => [id, targetPort(s, port, proto)]);
      }
      const id = "svc/" + peer.namespace + "/" + peer.name;
      if (!nodes.has(id)) nodes.set(id, { id, kind: "service", ns: peer.namespace, label: peer.name, members: [] });
      return [[id, port]];
    }
    const id = peer.kind === "node" ? "node/" + peer.name : peer.ip;
    // Nodes are the cluster's own machines, not "outside the cluster".
    const group = peer.kind === "node" ? "(cluster nodes)" : "(outside the cluster)";
    if (!nodes.has(id)) nodes.set(id, { id, kind: peer.kind, ns: group, label: peer.name || peer.ip, members: [] });
    return [[id, port]];
  };
  for (const e of edges) {
    const self = podById.get(e.pod); if (!self) continue;
    const me = podNode(self).id;
    for (const [other, port] of ends(e.peer, e.port, e.protocol)) {
      const [from, to] = e.direction === "outbound" ? [me, other] : [other, me];
      const k = from + "|" + to + "|" + e.protocol + "|" + port;
      const f = flows.get(k) || { from, to, port, protocol: e.protocol, open: false, attempted: true, conns: 0 };
      f.open = f.open || e.open; f.attempted = f.attempted && !!e.attempted; f.conns += e.connections;
      flows.set(k, f);
    }
  }
  // group parallel flows (same pair) into one drawn edge with several ports
  const pairs = new Map();
  for (const f of flows.values()) {
    const k = f.from + "|" + f.to;
    const g = pairs.get(k) || { from: f.from, to: f.to, ports: [], open: false, attempted: true, conns: 0 };
    g.ports.push(f.protocol + "/" + f.port); g.open = g.open || f.open; g.attempted = g.attempted && f.attempted; g.conns += f.conns;
    pairs.set(k, g);
  }
  return { nodes, flows: [...pairs.values()] };
}

const svg = document.getElementById("graph");
let view = "wl", N = [], F = [], nodes = new Map(), selected = null;
const defs = el("defs", {}, svg);
for (const [id, c] of [["arrow", "var(--edge)"], ["arrow-hl", "var(--accent)"]]) {
  const mk = el("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
  el("path", { d: "M0,0 L10,5 L0,10 z", style: "fill:" + c }, mk);
}
const root = el("g", {}, svg);
const color = { pod: "var(--pod)", service: "var(--svc)", node: "var(--node)", external: "var(--ext)" };
const radius = n => n.kind === "pod" ? 14 + 4 * Math.min(n.members.length - 1, 3) : 13;

function layout() {
  const nss = [...new Set(N.map(n => n.ns))].sort((a, b) => (a.startsWith("(") - b.startsWith("(")) || a.localeCompare(b));
  const R = nss.length > 1 ? 150 + 70 * nss.length : 0, anchor = {};
  nss.forEach((ns, i) => { const a = Math.PI + 2 * Math.PI * i / nss.length; anchor[ns] = { x: R * Math.cos(a), y: R * Math.sin(a) * 0.6 }; });
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (const n of N) { n.x = anchor[n.ns].x + (rnd() - .5) * 160; n.y = anchor[n.ns].y + (rnd() - .5) * 160; }
  for (let it = 0; it < 600; it++) {
    const cool = 1 - it / 600;
    for (const a of N) { a.vx = (anchor[a.ns].x - a.x) * 0.015; a.vy = (anchor[a.ns].y - a.y) * 0.03; }
    for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
      const a = N[i], b = N[j]; let dx = a.x - b.x, dy = a.y - b.y; const d2 = dx * dx + dy * dy || 0.01, d = Math.sqrt(d2);
      const f = (a.ns === b.ns ? 9000 : 14000) / d2; dx /= d; dy /= d;
      a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
    }
    for (const f of F) {
      const a = nodes.get(f.from), b = nodes.get(f.to); if (a === b) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1, k = (d - 170) * 0.02;
      a.vx += dx / d * k; a.vy += dy / d * k; b.vx -= dx / d * k; b.vy -= dy / d * k;
    }
    for (const n of N) { n.x += Math.max(-25, Math.min(25, n.vx)) * cool * 3; n.y += Math.max(-25, Math.min(25, n.vy)) * cool * 3; }
  }
  return nss;
}

let nss = [];
function render() {
  ({ nodes, flows: F } = build(view)); N = [...nodes.values()];
  nss = layout();
  root.replaceChildren();
  const gNS = el("g", {}, root), gF = el("g", {}, root), gN = el("g", {}, root);
  root.gNS = gNS;
  for (const f of F) {
    f.g = el("g", {}, gF);
    f.line = el("path", { class: "flow" + (f.attempted ? " attempted" : f.open ? "" : " closed"), "marker-end": "url(#arrow)" }, f.g);
    f.text = el("text", { class: "elabel", "text-anchor": "middle" }, f.g); f.text.textContent = [...new Set(f.ports)].join(", ");
    el("title", {}, f.line).textContent = `${nodes.get(f.from).label} → ${nodes.get(f.to).label}  ${f.ports.join(", ")}${f.attempted ? "  (never connected)" : f.open ? "" : "  (closed during window)"}`;
  }
  for (const n of N) {
    n.g = el("g", { class: "n" }, gN);
    const c = color[n.kind] || "var(--ext)", r = radius(n);
    const observed = n.members.some(p => p.probe.status === "observed");
    const fill = n.kind === "pod" && !observed ? "var(--panel)" : c;
    if (n.kind === "service") n.shape = el("rect", { class: "shape", x: -r, y: -r, width: 2 * r, height: 2 * r, rx: 6, fill, stroke: c }, n.g);
    else if (n.kind === "pod") n.shape = el("circle", { class: "shape", r, fill, stroke: c }, n.g);
    else n.shape = el("polygon", { class: "shape", points: `0,${-r - 2} ${r + 2},0 0,${r + 2} ${-r - 2},0`, fill, stroke: c }, n.g);
    el("text", { class: "nlabel", y: r + 16, "text-anchor": "middle" }, n.g).textContent = n.label;
    if (view === "wl" && n.members.length > 1) el("text", { class: "nsub", y: r + 30, "text-anchor": "middle" }, n.g).textContent = `×${n.members.length} pods`;
    n.g.addEventListener("click", ev => { ev.stopPropagation(); select(n.id); });
    n.g.addEventListener("pointerdown", ev => { ev.stopPropagation(); dragNode = n; svg.setPointerCapture(ev.pointerId); });
  }
  draw(); fit();
  if (selected && nodes.has(selected)) select(selected); else select(null);
}

function drawNamespaces() {
  const gNS = root.gNS; gNS.replaceChildren();
  for (const ns of nss) {
    const ms = N.filter(n => n.ns === ns); if (!ms.length) continue;
    const xs = ms.map(n => n.x), ys = ms.map(n => n.y);
    const x0 = Math.min(...xs) - 70, y0 = Math.min(...ys) - 52, x1 = Math.max(...xs) + 70, y1 = Math.max(...ys) + 52;
    el("rect", { x: x0, y: y0, width: x1 - x0, height: y1 - y0, rx: 16, fill: "var(--ns)", stroke: "var(--line)" }, gNS);
    el("text", { x: x0 + 14, y: y0 + 20, class: "nslabel" }, gNS).textContent = ns;
  }
}
function draw() {
  for (const n of N) n.g.setAttribute("transform", `translate(${n.x},${n.y})`);
  for (const f of F) {
    const a = nodes.get(f.from), b = nodes.get(f.to);
    if (a === b) { f.line.setAttribute("d", `M${a.x - 8},${a.y - radius(a)} c-30,-50 46,-50 16,0`); f.text.setAttribute("x", a.x); f.text.setAttribute("y", a.y - radius(a) - 40); continue; }
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    const sx = a.x + dx / d * (radius(a) + 3), sy = a.y + dy / d * (radius(a) + 3);
    const ex = b.x - dx / d * (radius(b) + 5), ey = b.y - dy / d * (radius(b) + 5);
    f.line.setAttribute("d", `M${sx},${sy} L${ex},${ey}`);
    f.text.setAttribute("x", sx + (ex - sx) * 0.5); f.text.setAttribute("y", sy + (ey - sy) * 0.5 - 6);
  }
  drawNamespaces();
}

let pan = { x: 0, y: 0, k: 1 }, dragNode = null, panning = null;
function fit() {
  if (!N.length) return;
  const r = svg.getBoundingClientRect(), xs = N.map(n => n.x), ys = N.map(n => n.y);
  const w = Math.max(...xs) - Math.min(...xs) + 200, h = Math.max(...ys) - Math.min(...ys) + 170;
  pan.k = Math.min(r.width / w, r.height / h, 1.7);
  pan.x = r.width / 2 - pan.k * (Math.min(...xs) + Math.max(...xs)) / 2;
  pan.y = r.height / 2 - pan.k * (Math.min(...ys) + Math.max(...ys)) / 2; apply();
}
function apply() { root.setAttribute("transform", `translate(${pan.x},${pan.y}) scale(${pan.k})`); }
function toLocal(ev) { const r = svg.getBoundingClientRect(); return { x: (ev.clientX - r.left - pan.x) / pan.k, y: (ev.clientY - r.top - pan.y) / pan.k }; }
svg.addEventListener("pointerdown", ev => { panning = { x: ev.clientX - pan.x, y: ev.clientY - pan.y }; svg.setPointerCapture(ev.pointerId); });
svg.addEventListener("pointermove", ev => {
  if (dragNode) { const p = toLocal(ev); dragNode.x = p.x; dragNode.y = p.y; draw(); }
  else if (panning) { pan.x = ev.clientX - panning.x; pan.y = ev.clientY - panning.y; apply(); }
});
svg.addEventListener("pointerup", () => { dragNode = null; panning = null; });
svg.addEventListener("wheel", ev => {
  ev.preventDefault(); const r = svg.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k = Math.max(0.2, Math.min(4, pan.k * (ev.deltaY < 0 ? 1.1 : 0.9)));
  pan.x = mx - (mx - pan.x) * k / pan.k; pan.y = my - (my - pan.y) * k / pan.k; pan.k = k; apply();
}, { passive: false });
svg.addEventListener("click", () => select(null));
window.addEventListener("resize", fit);

function rows(list, dir) {
  if (!list.length) return '<p class="muted">none observed</p>';
  return `<table><tr><th>${dir === "in" ? "from" : "to"}</th><th>port</th><th>state</th></tr>` + list.map(f => {
    const other = nodes.get(dir === "in" ? f.from : f.to);
    const st = f.attempted ? '<span class="bad">never connected</span>' : f.open ? "open" : '<span class="muted">closed</span>';
    return `<tr><td><a href="#" data-id="${esc(other.id)}">${esc(other.label)}</a>${other.ns !== nodes.get(selected).ns ? ' <span class="muted">' + esc(other.ns) + "</span>" : ""}</td><td>${esc([...new Set(f.ports)].join(", "))}</td><td>${st}</td></tr>`;
  }).join("") + "</table>";
}
function idleHelp() {
  return '<p class="muted">Select a node to see who it talks to. Drag to pan, scroll to zoom, drag a node to move it.</p>' +
    '<details class="limits"><summary>What this capture could not see</summary><ul>' +
    (DATA.limits || []).map(l => `<li>${esc(l)}</li>`).join("") + '</ul></details>';
}
function select(id) {
  selected = id;
  const d = document.getElementById("detail");
  const near = new Set(id ? [id, ...F.filter(f => f.from === id || f.to === id).flatMap(f => [f.from, f.to])] : []);
  for (const n of N) { n.g.classList.toggle("dim", !!id && !near.has(n.id)); n.g.classList.toggle("sel", n.id === id); }
  for (const f of F) {
    const on = id && (f.from === id || f.to === id);
    f.line.classList.toggle("hl", !!on); f.line.setAttribute("marker-end", on ? "url(#arrow-hl)" : "url(#arrow)");
    f.g.classList.toggle("dim", !!id && !on);
  }
  if (!id) { d.innerHTML = idleHelp(); return; }
  const n = nodes.get(id);
  let h = `<h2>${esc(n.label)}</h2><span class="pill">${esc(n.kind === "pod" ? (view === "wl" ? wlOf(n.members[0]).split("/")[0] : "pod") : n.kind)}</span><span class="pill">${esc(n.ns)}</span>`;
  if (n.members.length) {
    const ls = {}; for (const p of n.members) for (const l of p.listening || []) ls[l.protocol + "/" + l.port] = 1;
    if (Object.keys(ls).length) h += "<h3>listening</h3>" + Object.keys(ls).map(l => `<span class="pill">${esc(l)}</span>`).join("");
    h += `<h3>pods (${n.members.length})</h3>` + n.members.map(p => `<div>${esc(p.name)} <span class="${p.probe.status === "failed" ? "bad" : "muted"}">${esc(p.probe.status)}${p.probe.reason ? ": " + esc(p.probe.reason) : ""}</span></div>`).join("");
  }
  h += "<h3>inbound: who connects here</h3>" + rows(F.filter(f => f.to === id && f.from !== id), "in");
  h += "<h3>outbound: where it connects</h3>" + rows(F.filter(f => f.from === id && f.to !== id), "out");
  d.innerHTML = h;
  d.querySelectorAll("a[data-id]").forEach(a => a.addEventListener("click", ev => { ev.preventDefault(); select(a.dataset.id); }));
}
document.getElementById("find").addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase(); if (!q) return select(null);
  const n = N.find(n => n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q) || n.members.some(p => (p.ip || "").startsWith(q) || p.name.includes(q)));
  if (n) select(n.id);
});
for (const [btn, v] of [["v-wl", "wl"], ["v-pod", "pod"]]) document.getElementById(btn).addEventListener("click", () => {
  if (view === v) return;
  // carry the selection across views where it maps cleanly
  const cur = selected && nodes.get(selected);
  view = v; document.getElementById("v-wl").classList.toggle("on", v === "wl"); document.getElementById("v-pod").classList.toggle("on", v === "pod");
  selected = cur && cur.members.length ? (v === "wl" ? "wl:" + wlKey(cur.members[0]) : cur.members[0].namespace + "/" + cur.members[0].name) : null;
  render();
});
if (GRAPHQL) {
  document.getElementById("console").hidden = false;
  document.getElementById("run").addEventListener("click", async () => {
    const out = document.getElementById("out"); out.textContent = "…";
    try {
      const r = await fetch(GRAPHQL, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ query: document.getElementById("q").value }) });
      out.textContent = JSON.stringify(await r.json(), null, 2);
    } catch (e) { out.textContent = String(e); }
  });
}
render();
</script>
</body>
