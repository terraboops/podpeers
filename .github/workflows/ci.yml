name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the hygiene check reads every version ever committed
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install OCR for the image hygiene check, and Graphviz to parse the DOT output
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr ffmpeg graphviz >/dev/null
      - name: hygiene (no real IPs or credentials in a public repo, text and images)
        run: HYGIENE_IMAGES=1 ./hack/hygiene.sh
      - name: hygiene across the whole history (a leak removed from the tree is still public)
        run: HYGIENE_IMAGES=1 ./hack/hygiene.sh --history
      - name: vet and gofmt
        run: make vet
      - name: unit tests
        run: PODPEERS_REQUIRE_DOT=1 PODPEERS_REQUIRE_OCR=1 go test -race -count=1 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: mutants (each negative case's protection, broken, must fail the unit tests, and the browser checks where only a browser can tell)
        run: ./hack/mutants.sh --ui
      - name: shell syntax
        run: bash -n hack/e2e-cluster.sh skills/podpeers-netpol/scripts/netpol-check.sh
      - name: build
        run: make build

  docs:
    # Render every Mermaid diagram in the Markdown with the same library
    # GitHub uses; a diagram that does not parse fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: render mermaid diagrams
        run: ./hack/check-docs.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: drive the web UI in headless Chrome (groups, views, GraphQL console)
        run: ./hack/check-ui.sh

  e2e:
    # A real, throwaway, single-node k3d cluster on the runner. Nothing here
    # can reach any other cluster: the suite only uses the kubeconfig the
    # cluster script writes to .e2e/, and refuses any other context.
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 90 # the suite plus every mutant against the real cluster; ~50 min with 31 mutants
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - name: install k3d
        run: curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
      - name: install kwokctl (a second, simulated cluster for the node gate's same-identity test)
        run: go install sigs.k8s.io/kwok/cmd/kwokctl@v0.7.0 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: end-to-end against a real local cluster
        run: make e2e
      - name: mutants against the real cluster (the e2e tests must fail when each protection is broken)
        run: ./hack/mutants.sh --e2e
      - name: keep the observed output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            .e2e/out/
            .e2e/mutants/
      - name: tear down
        if: always()
        run: ./hack/e2e-cluster.sh down || true
