# Fixture for the audit fixes (test/e2e/audit_test.go). Every name is invented.
# Targets carry podpeers-e2e=audit.
#
#   pp-xa/gw        -> svc pp-xa/web:8080 and svc pp-xa/webpod:8080, long-lived.
#                      Its controller ownerReference is hostile: ESC, BEL and
#                      line breaks that would start a ConfigMap document.
#   pp-xa web       a Deployment AND a bare Pod both named web, so a policy
#                   name without the kind collides.
#   pp-xb/client    -> svc pp-xb/web:80, whose selector (app=web) also matches
#                      pp-xa's Deployment pods: a Service selects only in its
#                      own namespace, so that flow says nothing about pp-xa.
#   pp-xz/stale     a pod that has finished; the test makes the node's IPAM
#                   hand its address to a new running pod in pp-xa (reuser).
---
apiVersion: v1
kind: Namespace
metadata: {name: pp-xa}
---
apiVersion: v1
kind: Namespace
metadata: {name: pp-xb}
---
apiVersion: v1
kind: Namespace
metadata: {name: pp-xz}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: pp-xa}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata:
      labels: {app: web, podpeers-e2e: audit}
    spec:
      terminationGracePeriodSeconds: 1
      nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-server-0}
      containers:
      - name: main
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["nc", "-lk", "-p", "8080", "-e", "cat"]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: pp-xa}
spec:
  selector: {app: web}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: pp-xa
  labels: {app: webpod, podpeers-e2e: audit}
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-server-0}
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["nc", "-lk", "-p", "8080", "-e", "cat"]
---
apiVersion: v1
kind: Service
metadata: {name: webpod, namespace: pp-xa}
spec:
  selector: {app: webpod}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: gw
  namespace: pp-xa
  labels: {app: gw, podpeers-e2e: audit}
  ownerReferences:
  - apiVersion: example.invalid/v1
    kind: Gateway
    name: "gw\e]0;pp\a\n---\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: injected\n---\n# tail"
    uid: 00000000-0000-0000-0000-000000000001
    controller: true
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-server-0}
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "until nc -z -w 2 web 8080 && nc -z -w 2 webpod 8080; do sleep 1; done; sleep 86400 | nc webpod 8080 & sleep 86400 | nc web 8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: pp-xb}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata:
      labels: {app: web, podpeers-e2e: audit}
    spec:
      terminationGracePeriodSeconds: 1
      nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-server-0}
      containers:
      - name: main
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["nc", "-lk", "-p", "8080", "-e", "cat"]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: pp-xb}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: pp-xb
  labels: {app: client, podpeers-e2e: audit}
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-server-0}
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "until nc -z -w 2 web 80; do sleep 1; done; sleep 86400 | nc web 80"]
---
apiVersion: v1
kind: Pod
metadata:
  name: stale
  namespace: pp-xz
  labels: {app: stale}
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  nodeName: k3d-podpeers-e2e-agent-0
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["true"]
