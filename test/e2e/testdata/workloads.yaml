# End-to-end fixture: workloads whose connections are known in advance.
# Every name is invented. Targets carry podpeers-e2e=target. Cross-namespace
# names are fully qualified: busybox's resolver does not expand "svc.ns".
# Clients wait for their server (nc -z) before opening the long-lived connection.
#
# Expected flows (client -> server):
#   pp-app/web      -> svc pp-app/api:9000   long-lived (pod-level: web -> api)
#   pp-app/brief    -> svc pp-app/api:9000   closed by the test mid-window
#   pp-app/excluded -> svc pp-app/api:9000   long-lived, but excluded pod is NOT probed
#   pp-edge/gateway -> svc pp-app/web:8080   cross-namespace, long-lived
#   pp-app/loner                             no peers at all
#   pp-app/pending                           never schedules (skipped)
#   pp-locked/vault                          target in a namespace the limited
#                                            identity may read but not modify
---
apiVersion: v1
kind: Namespace
metadata: {name: pp-app}
---
apiVersion: v1
kind: Namespace
metadata: {name: pp-edge}
---
apiVersion: v1
kind: Namespace
metadata: {name: pp-locked}
---
apiVersion: v1
kind: Namespace
metadata: {name: pp-sealed}
---
apiVersion: v1
kind: Pod
metadata:
  name: api
  namespace: pp-app
  labels: {app: api, podpeers-e2e: target}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["nc", "-lk", "-p", "9000", "-e", "cat"]
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: pp-app}
spec:
  selector: {app: api}
  ports: [{port: 9000, targetPort: 9000}]
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  namespace: pp-app
  labels: {app: web, podpeers-e2e: target}
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-server-0}
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    # serve 8080 and hold one connection open to the api service
    command: ["sh", "-c", "nc -lk -p 8080 -e cat & until nc -z -w 2 api 9000; do sleep 1; done; sleep 86400 | nc api 9000"]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: pp-app}
spec:
  selector: {app: web}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: v1
kind: Pod
metadata:
  name: brief
  namespace: pp-app
  labels: {app: brief, podpeers-e2e: target}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    # one connection to api; the test kills nc mid-window and it is not reopened
    command: ["sh", "-c", "until nc -z -w 2 api 9000; do sleep 1; done; sleep 86400 | nc api 9000; sleep 86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: excluded
  namespace: pp-app
  labels: {app: excluded, podpeers-e2e: other}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "until nc -z -w 2 api 9000; do sleep 1; done; sleep 86400 | nc api 9000"]
---
apiVersion: v1
kind: Pod
metadata:
  name: loner
  namespace: pp-app
  labels: {app: loner, podpeers-e2e: target}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sleep", "86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: pending
  namespace: pp-app
  labels: {app: pending, podpeers-e2e: target}
spec:
  nodeSelector: {podpeers-e2e/no-such-node: "true"}
  containers:
  - name: main
    image: busybox:1.36
    command: ["sleep", "86400"]
---
apiVersion: v1
kind: Pod
metadata:
  name: gateway
  namespace: pp-edge
  labels: {app: gateway, podpeers-e2e: target}
spec:
  terminationGracePeriodSeconds: 1
  # gateway and web run on different nodes: their flow is cross-node.
  nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-agent-0}
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "until nc -z -w 2 web.pp-app.svc.cluster.local 8080; do sleep 1; done; sleep 86400 | nc web.pp-app.svc.cluster.local 8080"]
---
apiVersion: v1
kind: Pod
metadata:
  name: vault
  namespace: pp-locked
  labels: {app: vault, podpeers-e2e: locked}
spec:
  terminationGracePeriodSeconds: 1
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sleep", "86400"]
---
# A limited identity: may probe pods in pp-app, may only read pods in
# pp-locked, and has no access at all to pp-sealed. It may list nodes so the
# tool's local-cluster check can run.
apiVersion: v1
kind: ServiceAccount
metadata: {name: pp-limited, namespace: pp-app}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: pp-limited-nodes}
rules:
- {apiGroups: [""], resources: [nodes], verbs: [list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: pp-limited-nodes}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: pp-limited-nodes}
subjects: [{kind: ServiceAccount, name: pp-limited, namespace: pp-app}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: pp-reader, namespace: pp-locked}
rules:
- {apiGroups: [""], resources: [pods, services], verbs: [get, list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: pp-reader, namespace: pp-locked}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: pp-reader}
subjects: [{kind: ServiceAccount, name: pp-limited, namespace: pp-app}]
---
# A namespace that ENFORCES the "restricted" Pod Security Standard. The
# workloads comply; podpeers' debug container must be admitted here too.
apiVersion: v1
kind: Namespace
metadata:
  name: pp-strict
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Pod
metadata:
  name: vaultd
  namespace: pp-strict
  labels: {app: vaultd, podpeers-e2e: strict}
spec:
  terminationGracePeriodSeconds: 1
  securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["nc", "-lk", "-p", "9000", "-e", "cat"]
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: vaultd, namespace: pp-strict}
spec:
  selector: {app: vaultd}
  ports: [{port: 9000, targetPort: 9000}]
---
apiVersion: v1
kind: Pod
metadata:
  name: auditor
  namespace: pp-strict
  labels: {app: auditor, podpeers-e2e: strict}
spec:
  terminationGracePeriodSeconds: 1
  securityContext: {runAsNonRoot: true, runAsUser: 65534, seccompProfile: {type: RuntimeDefault}}
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "until nc -z -w 2 vaultd 9000; do sleep 1; done; sleep 86400 | nc vaultd 9000"]
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
---
# UDP, across nodes. udp-echo is busybox `nc -u -l`, which connect()s to its
# client, so /proc shows the peer on both ends. dnsd is a real unconnected UDP
# server: /proc records its port and NO peer, so its clients can only be seen
# from the client side. That difference is what the test asserts.
apiVersion: v1
kind: Namespace
metadata: {name: pp-udp}
---
apiVersion: v1
kind: Pod
metadata:
  name: udp-echo
  namespace: pp-udp
  labels: {app: udp-echo, podpeers-e2e: udp}
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-server-0}
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "while true; do nc -u -l -p 5353 > /dev/null; done"]
---
apiVersion: v1
kind: Service
metadata: {name: udp-echo, namespace: pp-udp}
spec: {selector: {app: udp-echo}, ports: [{port: 5353, targetPort: 5353, protocol: UDP}]}
---
apiVersion: v1
kind: Pod
metadata:
  name: dnsd
  namespace: pp-udp
  labels: {app: dnsd, podpeers-e2e: udp}
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-server-0}
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["dnsd", "-p", "5354"]
---
apiVersion: v1
kind: Service
metadata: {name: dnsd, namespace: pp-udp}
spec: {selector: {app: dnsd}, ports: [{port: 5354, targetPort: 5354, protocol: UDP}]}
---
apiVersion: v1
kind: Pod
metadata:
  name: udp-client
  namespace: pp-udp
  labels: {app: udp-client, podpeers-e2e: udp}
spec:
  terminationGracePeriodSeconds: 1
  nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-agent-0}
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    # two connected UDP sockets, one datagram a second each
    command: ["sh", "-c", "(while true; do echo hi; sleep 1; done | nc -u udp-echo.pp-udp.svc.cluster.local 5353) & while true; do echo q; sleep 1; done | nc -u dnsd.pp-udp.svc.cluster.local 5354"]
