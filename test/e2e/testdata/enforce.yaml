# Policy enforcement fixture. The test replaces @EXT1@ (a server outside the
# cluster) and @NODE@ (the server node's address) before applying it.
#
# Captured (label podpeers-e2e=enforce, not decoy):
#   pp-front/web (agent node)  -> svc pp-back/api:8080      cross-namespace
#   pp-front/web               -> @NODE@:7100                a node address
#   pp-back/api  (server node) -> @EXT1@:7000                outside the cluster
#   hostcli (agent node, host network) -> svc pp-back/api:8080   from a node
# Not captured, used only to probe what the policies must block:
#   pp-front/stranger, pp-other/impostor (web's labels, wrong namespace)
# Every listener also has a second port that nothing uses during the capture.
apiVersion: v1
kind: Namespace
metadata: {name: pp-front}
---
apiVersion: v1
kind: Namespace
metadata: {name: pp-back}
---
apiVersion: v1
kind: Namespace
metadata: {name: pp-other}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: pp-back}
spec:
  selector: {app: api}
  ports:
  - {name: main, port: 8080, targetPort: 8080}
  - {name: admin, port: 8081, targetPort: 8081}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: pp-back}
spec:
  replicas: 1
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api, podpeers-e2e: enforce}}
    spec:
      terminationGracePeriodSeconds: 1
      nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-server-0}
      containers:
      - {name: main, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["nc", "-lk", "-p", "8080", "-e", "cat"]}
      - {name: admin, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["nc", "-lk", "-p", "8081", "-e", "cat"]}
      - name: client
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "until nc -z -w 2 @EXT1@ 7000; do sleep 1; done; sleep 86400 | nc @EXT1@ 7000"]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: pp-front}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web, podpeers-e2e: enforce}}
    spec:
      terminationGracePeriodSeconds: 1
      nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-agent-0}
      containers:
      - name: to-api
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "until nc -z -w 2 api.pp-back.svc.cluster.local 8080; do sleep 1; done; sleep 86400 | nc api.pp-back.svc.cluster.local 8080"]
      - name: to-node
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "until nc -z -w 2 @NODE@ 7100; do sleep 1; done; sleep 86400 | nc @NODE@ 7100"]
---
# Listens on the server node's own address.
apiVersion: v1
kind: Pod
metadata: {name: nodesvc, namespace: pp-other}
spec:
  hostNetwork: true
  terminationGracePeriodSeconds: 1
  nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-server-0}
  containers:
  - {name: a, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["nc", "-lk", "-p", "7100", "-e", "cat"]}
  - {name: b, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["nc", "-lk", "-p", "7101", "-e", "cat"]}
---
# A process on the agent node itself (host network) that uses api.
apiVersion: v1
kind: Pod
metadata: {name: hostcli, namespace: pp-other}
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  terminationGracePeriodSeconds: 1
  nodeSelector: {kubernetes.io/hostname: k3d-podpeers-e2e-agent-0}
  containers:
  - name: main
    image: busybox:1.36
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "until nc -z -w 2 api.pp-back.svc.cluster.local 8080; do sleep 1; done; sleep 86400 | nc api.pp-back.svc.cluster.local 8080"]
---
# Same namespace as web, not web.
apiVersion: v1
kind: Pod
metadata: {name: stranger, namespace: pp-front, labels: {app: stranger}}
spec:
  terminationGracePeriodSeconds: 1
  containers: [{name: main, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["sleep", "86400"]}]
---
# Every label web has (plus one), in another namespace.
apiVersion: v1
kind: Pod
metadata: {name: impostor, namespace: pp-other, labels: {app: web, podpeers-e2e: enforce, decoy: "yes"}}
spec:
  terminationGracePeriodSeconds: 1
  containers: [{name: main, image: busybox:1.36, imagePullPolicy: IfNotPresent, command: ["sleep", "86400"]}]
