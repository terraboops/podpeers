apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "shop.labels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels: {{- include "shop.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: api
        image: {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        command: ["nc", "-lk", "-p", "9000", "-e", "cat"]
        ports:
        - {name: api, containerPort: 9000}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  selector: {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
  - {port: 80, targetPort: api}
