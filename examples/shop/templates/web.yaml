apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "shop.labels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels: {{- include "shop.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: web
        image: {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        # Serve the front door on 8080 (echo), and keep calling api.
        command:
        - sh
        - -c
        - |
          nc -lk -p 8080 -e cat &
          while true; do
            sleep {{ .Values.reconnectSeconds }} | nc -w 2 {{ include "shop.fqdn" (dict "Release" .Release "component" "api" "ns" .Release.Namespace) }} 80
            sleep 1
          done
        ports:
        - {name: http, containerPort: 8080}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "shop.labels" . | nindent 4 }}
spec:
  selector: {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
  - {port: 8080, targetPort: http}
